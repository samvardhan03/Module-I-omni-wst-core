[build-system]
requires = ["scikit-build-core", "pybind11", "cmake"]
build-backend = "scikit_build_core.build"

[project]
name = "omni-wst-core"
version = "1.0.0"
description = "Phase 1: C++/CUDA Mathematical Primitives for OmniPulse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DCUDA_ARCH=native", "-DBUILD_PYBIND11=ON", "-DCOMMERCIAL_USE=ON"]
