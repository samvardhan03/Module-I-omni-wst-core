name: Build and Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build_sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install build dependencies
        run: pip install build
      - name: Build sdist
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build Wheels on CUDA Runner
    # To build CUDA wheels, this must run on a runner with NVIDIA drivers & CUDA toolkit.
    # We target self-hosted or a specific CUDA container.
    runs-on: ubuntu-latest 
    container:
      image: nvidia/cuda:12.1.1-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install OS dependencies and Python
        run: |
          apt-get update
          apt-get install -y python3-pip python3-venv git
          
      - name: Install build tools
        run: python3 -m pip install build setuptools wheel scikit-build-core pybind11 cmake ninja
        
      - name: Build wheel
        run: python3 -m build --wheel
        env:
          CUDACXX: /usr/local/cuda/bin/nvcc
          
      - name: Repair wheel for PyPI (manylinux)
        run: |
          python3 -m pip install auditwheel
          auditwheel repair dist/*.whl --plat manylinux_2_35_x86_64 -w dist_repaired/
          
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-ubuntu-latest
          path: dist_repaired/*.whl

  publish_pypi:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    
    # Required for PyPI Trusted Publisher
    permissions:
      id-token: write
      contents: read
      
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
